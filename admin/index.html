<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Summer Lounge · Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#172521;--forest:#244d45;--forest2:#183a34;--sage:#dbe9e0;--cream:#f8f4ec;--paper:#fff;--gold:#b49463;--gold2:#d8c19a;--muted:#71807a;--line:#173c3420;--danger:#a85850;--warning:#9a6c35;--shadow:0 18px 55px rgba(22,54,47,.08)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:#f5f3ee;color:var(--ink);font-family:"DM Sans",sans-serif}button,input,select{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}
.app-shell{min-height:100vh;display:grid;grid-template-columns:250px 1fr}.sidebar{background:var(--forest2);color:#fff;position:sticky;top:0;height:100vh;padding:25px 18px;display:flex;flex-direction:column}.brand{display:flex;align-items:center;justify-content:center;padding:4px 0 28px;border-bottom:1px solid #ffffff18}.brand img{width:92px;height:92px;object-fit:contain;border-radius:50%;background:#000;box-shadow:0 10px 28px #0004}.brand-note{font-size:9px;letter-spacing:2.5px;text-transform:uppercase;color:#c8d6d0;text-align:center;margin-top:12px}.nav{padding:25px 0;display:grid;gap:7px}.nav button{border:0;background:transparent;color:#cddbd6;text-align:left;padding:13px 14px;border-radius:12px;display:flex;gap:12px;align-items:center;font-weight:600}.nav button.active,.nav button:hover{background:#ffffff10;color:#fff}.nav .icon{width:20px;text-align:center;color:var(--gold2)}.sidebar-footer{margin-top:auto;font-size:11px;color:#9eb1aa;line-height:1.6;padding:14px}.sidebar-footer span{display:block;color:#dfe8e4}
.content{min-width:0}.topbar{height:82px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 34px;position:sticky;top:0;z-index:20}.top-left h1{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:600;margin:0;line-height:1}.top-left p{margin:5px 0 0;color:var(--muted);font-size:12px}.top-actions{display:flex;align-items:center;gap:10px}.status-dot{width:8px;height:8px;border-radius:50%;background:#55a884;box-shadow:0 0 0 4px #55a88418}.live{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:11px}.icon-btn,.btn{border:0;border-radius:12px;padding:11px 15px;font-weight:600}.icon-btn{background:#f5f4ef;color:var(--forest);border:1px solid var(--line)}.btn.primary{background:var(--forest);color:#fff}.btn.gold{background:var(--gold);color:#fff}.btn.light{background:#fff;color:var(--forest);border:1px solid var(--line)}.btn.danger{background:#fff;color:var(--danger);border:1px solid #a8585030}.btn.small{padding:7px 10px;font-size:11px;border-radius:9px}.main{padding:30px 34px 50px;max-width:1600px}.view{display:none}.view.active{display:block}
.hero-card{background:linear-gradient(135deg,var(--forest2),#2c5b51);color:#fff;border-radius:24px;padding:28px 30px;box-shadow:var(--shadow);display:flex;align-items:flex-end;justify-content:space-between;gap:25px;margin-bottom:22px;overflow:hidden;position:relative}.hero-card:after{content:"";position:absolute;width:300px;height:300px;border:1px solid #ffffff15;border-radius:50%;right:-80px;top:-160px}.eyebrow{font-size:10px;letter-spacing:2.5px;text-transform:uppercase;color:#b8cbc4;margin-bottom:8px}.hero-card h2{font-family:"Cormorant Garamond",serif;font-size:42px;margin:0 0 5px;font-weight:600}.hero-card p{margin:0;color:#d2dfda;font-size:13px}.hero-card .date-big{font-size:12px;color:#e5ece9;text-align:right;position:relative;z-index:1}.hero-card .date-big b{display:block;font-family:"Cormorant Garamond",serif;font-size:28px;color:#fff}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #173c3408}.stat-top{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:1.2px}.stat-icon{width:34px;height:34px;border-radius:10px;background:var(--sage);display:grid;place-items:center;color:var(--forest);font-weight:700}.stat b{display:block;font-size:31px;margin-top:10px;letter-spacing:-1px}.stat small{color:var(--muted);font-size:11px}.panel{background:#fff;border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:var(--shadow);margin-bottom:20px}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:18px}.panel-head h3{font-family:"Cormorant Garamond",serif;font-size:27px;margin:0}.panel-head p{font-size:11px;color:var(--muted);margin:4px 0 0}.toolbar{display:flex;gap:10px;align-items:end;flex-wrap:wrap}.field{display:flex;flex-direction:column;gap:6px}.field label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:600}.field input,.field select{padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);outline:none}.field input:focus,.field select:focus{border-color:var(--gold);box-shadow:0 0 0 3px #b4946318}.grow{flex:1;min-width:180px}.search{position:relative}.search input{width:100%;padding-left:35px}.search span{position:absolute;left:12px;bottom:10px;color:var(--muted)}
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:14px}.table{width:100%;border-collapse:collapse;min-width:950px}.table th,.table td{text-align:left;padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}.table tr:last-child td{border-bottom:0}.table th{background:#fafaf7;font-size:9px;text-transform:uppercase;letter-spacing:1.2px;color:var(--muted);position:sticky;top:0}.table td{font-size:12px}.guest{display:flex;align-items:center;gap:10px}.avatar{width:32px;height:32px;border-radius:50%;background:var(--sage);display:grid;place-items:center;color:var(--forest);font-weight:700}.guest strong{display:block}.guest small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.badge{display:inline-flex;align-items:center;gap:6px;padding:6px 9px;border-radius:20px;font-size:10px;font-weight:700;text-transform:capitalize}.badge:before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}.confirmed{background:#dce9e2;color:#2f695c}.pending,.waitlist{background:#f7e7d4;color:#8a6133}.cancelled,.no_show{background:#f2dddd;color:#99544d}.completed{background:#e9e5f1;color:#66547e}.actions{display:flex;gap:6px}.empty{text-align:center;padding:45px 20px;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-family:"Cormorant Garamond",serif;font-size:24px;margin-bottom:5px}.skeleton{height:13px;background:linear-gradient(90deg,#f2f1ec,#fff,#f2f1ec);background-size:200% 100%;animation:shine 1.2s infinite;border-radius:6px}@keyframes shine{to{background-position:-200% 0}}
.capacity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.capacity-card{border:1px solid var(--line);border-radius:16px;padding:16px}.capacity-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}.capacity-head strong{font-family:"Cormorant Garamond",serif;font-size:22px}.capacity-meta{font-size:11px;color:var(--muted)}.capacity-controls{display:flex;gap:8px;align-items:end}.capacity-controls .field{flex:1}.switch{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding-bottom:11px}.switch input{accent-color:var(--forest)}
.login-screen{min-height:100vh;display:grid;place-items:center;padding:25px;background:radial-gradient(circle at top right,#dbe9e0 0,#f5f3ee 40%,#f5f3ee 100%)}.login-card{width:min(430px,100%);background:#fff;border:1px solid var(--line);border-radius:26px;padding:34px;box-shadow:0 30px 90px #173c3418}.login-logo{display:grid;place-items:center;margin-bottom:22px}.login-logo img{width:108px;height:108px;object-fit:contain;border-radius:50%;background:#000}.login-card h1{font-family:"Cormorant Garamond",serif;font-size:38px;text-align:center;margin:10px 0 4px}.login-card .sub{text-align:center;color:var(--muted);font-size:12px;margin:0 0 26px}.login-card .field{margin-bottom:15px}.login-card .btn{width:100%;padding:13px}.error{color:var(--danger);font-size:12px;min-height:18px;margin:9px 0}.security-note{margin-top:20px;padding:12px;border-radius:12px;background:#f6f7f3;color:var(--muted);font-size:10px;line-height:1.6}
.drawer{position:fixed;inset:0;background:#0d211d88;z-index:50;display:none}.drawer.open{display:block}.drawer-card{position:absolute;right:0;top:0;height:100%;width:min(480px,92vw);background:#fff;padding:25px;overflow:auto;box-shadow:-20px 0 60px #0002}.drawer-head{display:flex;justify-content:space-between;align-items:flex-start}.drawer-head h2{font-family:"Cormorant Garamond",serif;font-size:34px;margin:0}.detail-list{margin:25px 0}.detail-row{padding:12px 0;border-bottom:1px solid var(--line)}.detail-row label{display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;color:var(--muted);margin-bottom:5px}.detail-row span{font-size:13px}.toast{position:fixed;right:25px;bottom:25px;z-index:100;background:var(--forest2);color:#fff;padding:13px 17px;border-radius:12px;box-shadow:0 20px 50px #0003;font-size:12px;transform:translateY(20px);opacity:0;pointer-events:none;transition:.25s}.toast.show{transform:none;opacity:1}.mobile-menu{display:none}
@media(max-width:1100px){.app-shell{grid-template-columns:82px 1fr}.sidebar{padding:20px 10px}.brand img{width:55px;height:55px}.brand-note,.nav button span:not(.icon),.sidebar-footer{display:none}.nav button{justify-content:center}.stats{grid-template-columns:repeat(2,1fr)}.capacity-grid{grid-template-columns:1fr 1fr}.topbar{padding:0 22px}.main{padding:24px 22px}}
@media(max-width:700px){.app-shell{display:block}.sidebar{position:fixed;left:-260px;width:250px;z-index:60;transition:.25s;height:100vh}.sidebar.open{left:0}.app-shell.menu-open:after{content:"";position:fixed;inset:0;background:#0d211d88;z-index:55}.mobile-menu{display:grid;place-items:center}.topbar{height:72px;padding:0 16px}.top-left h1{font-size:27px}.top-left p{display:none}.main{padding:18px 14px 35px}.hero-card{padding:22px;display:block}.hero-card h2{font-size:36px}.hero-card .date-big{text-align:left;margin-top:16px}.stats{gap:9px}.stat{padding:14px}.stat b{font-size:25px}.stat small{display:none}.panel{padding:15px;border-radius:17px}.panel-head{align-items:flex-start}.capacity-grid{grid-template-columns:1fr}.toolbar{align-items:stretch}.toolbar .field{width:100%}.toolbar .btn{width:100%}.live{display:none}}

/* Premium operations dashboard */
.kpi-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:20px}.kpi{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 8px 28px #173c3408}.kpi-label{font-size:10px;text-transform:uppercase;letter-spacing:1.1px;color:var(--muted);font-weight:700}.kpi-value{font-size:30px;font-weight:700;margin:9px 0 4px;letter-spacing:-1px}.kpi-note{font-size:10px;color:var(--muted)}.dashboard-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}.dashboard-grid .panel{margin-bottom:0}.service-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:20px}.service-chip{background:#f7f6f1;border:1px solid var(--line);border-radius:14px;padding:13px}.service-chip b{display:block;font-size:17px}.service-chip span{font-size:10px;color:var(--muted)}.timeline{display:grid;gap:10px}.time-row{display:grid;grid-template-columns:58px 1fr;gap:12px;align-items:center}.time-label{font-size:10px;color:var(--muted);text-align:right}.time-track{height:42px;background:#f5f5f0;border-radius:11px;position:relative;overflow:hidden}.time-fill{height:100%;border-radius:11px;background:linear-gradient(90deg,#244d45,#6c9b8c);min-width:3px}.time-text{position:absolute;left:12px;top:12px;font-size:10px;color:#fff;font-weight:700;text-shadow:0 1px 2px #0004}.donut-wrap{display:grid;place-items:center;padding:8px 0 16px}.donut{width:170px;height:170px;border-radius:50%;background:conic-gradient(#2f695c 0 55%,#b49463 55% 75%,#a85850 75% 88%,#66547e 88% 100%);position:relative}.donut:after{content:'';position:absolute;inset:28px;background:#fff;border-radius:50%}.legend{display:grid;gap:8px}.legend-row{display:flex;align-items:center;justify-content:space-between;font-size:11px}.legend-left{display:flex;align-items:center;gap:8px}.legend-dot{width:8px;height:8px;border-radius:50%}.trend{height:190px;display:flex;align-items:flex-end;gap:10px;padding:10px 4px 0}.trend-day{flex:1;display:flex;flex-direction:column;align-items:center;gap:7px;height:100%;justify-content:flex-end}.trend-bar{width:100%;max-width:34px;border-radius:8px 8px 3px 3px;background:linear-gradient(180deg,#b49463,#244d45);min-height:4px}.trend-day b{font-size:10px}.trend-day span{font-size:9px;color:var(--muted)}.attention{display:grid;gap:9px}.attention-item{display:flex;justify-content:space-between;gap:10px;padding:11px 12px;border-radius:12px;background:#fafaf7;border:1px solid var(--line);align-items:center}.attention-item strong{font-size:12px}.attention-item small{display:block;color:var(--muted);font-size:10px;margin-top:2px}.mobile-only{display:none}
@media(max-width:1100px){.kpi-grid{grid-template-columns:repeat(2,1fr)}.dashboard-grid{grid-template-columns:1fr}.service-strip{grid-template-columns:repeat(2,1fr)}}
@media(max-width:650px){.kpi-grid{grid-template-columns:1fr 1fr}.service-strip{grid-template-columns:1fr 1fr}.trend{gap:5px}.main{padding:20px 16px 40px}.topbar{padding:0 16px}.top-left h1{font-size:28px}.top-actions .live{display:none}}
</style>
</head>
<body>
<div id="root"></div>
<div class="toast" id="toast"></div>
<script>
const LOGO='../assets/summer-lounge-logo.jpg';
const root=document.getElementById('root');
let token=localStorage.getItem('tsl_admin_token');
let state={date:localDate(),status:'',search:'',rows:[],tables:[],loading:false,lastUpdated:null};
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const localDate=()=>{const d=new Date();return new Date(d.getTime()-d.getTimezoneOffset()*60000).toISOString().slice(0,10)};
const formatDate=d=>new Date(d+'T00:00:00').toLocaleDateString('en-KE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
const initials=n=>String(n||'G').trim().split(/\s+/).slice(0,2).map(x=>x[0]).join('').toUpperCase();
function showToast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.classList.remove('show'),2600)}
function login(){root.innerHTML=`<main class="login-screen"><section class="login-card"><div class="login-logo"><img src="${LOGO}" alt="The Summer Lounge logo"></div><h1>Staff Portal</h1><p class="sub">Reservations & floor management</p><div class="field"><label>Admin password</label><input id="pw" type="password" autocomplete="current-password" placeholder="Enter your password"></div><button class="btn primary" id="loginBtn">Sign in securely</button><div class="error" id="err"></div><div class="security-note">Private staff area. Your session is stored only in this browser and protected by the site's admin authentication.</div></section></main>`;document.getElementById('loginBtn').onclick=doLogin;document.getElementById('pw').addEventListener('keydown',e=>{if(e.key==='Enter')doLogin()})}
async function doLogin(){const err=document.getElementById('err');const btn=document.getElementById('loginBtn');btn.disabled=true;btn.textContent='Signing in…';try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({password:document.getElementById('pw').value})});const d=await r.json();if(!r.ok)throw new Error(d.error||'Invalid password');localStorage.setItem('tsl_admin_token',d.token);token=d.token;renderShell();load();}catch(e){err.textContent=e.message}finally{btn.disabled=false;btn.textContent='Sign in securely'}}
async function api(url,opt={}){const r=await fetch(url,{...opt,headers:{'content-type':'application/json',authorization:'Bearer '+token,...(opt.headers||{})}});if(r.status===401){localStorage.removeItem('tsl_admin_token');token=null;login();throw new Error('Unauthorized')}const d=await r.json();if(!r.ok)throw new Error(d.error||'Request failed');return d}
function renderShell(){root.innerHTML=`<div class="app-shell" id="shell"><aside class="sidebar" id="sidebar"><div class="brand"><div><img src="${LOGO}" alt="The Summer Lounge logo"><div class="brand-note">Staff portal</div></div></div><nav class="nav"><button class="active" data-view="dashboard"><span class="icon">⌂</span><span>Overview</span></button><button data-view="reservations"><span class="icon">▦</span><span>Reservations</span></button><button data-view="tables"><span class="icon">◇</span><span>Tables & capacity</span></button></nav><div class="sidebar-footer">Logged in as<br><span>Restaurant staff</span><br><br>The Summer Lounge<br>Sarit Centre · Nairobi</div></aside><div class="content"><header class="topbar"><div class="top-left"><h1 id="pageTitle">Today</h1><p id="pageSub">Live reservation overview</p></div><div class="top-actions"><div class="live"><i class="status-dot"></i>Live database</div><button class="icon-btn mobile-menu" id="mobileMenu">☰</button><button class="icon-btn" id="refreshTop">↻ Refresh</button><button class="icon-btn" id="logout">Log out</button></div></header><main class="main"><section class="view active" id="dashboard"></section><section class="view" id="reservations"></section><section class="view" id="tables"></section></main></div></div><div class="drawer" id="drawer"><div class="drawer-card" id="drawerCard"></div></div>`;document.querySelectorAll('.nav button').forEach(b=>b.onclick=()=>switchView(b.dataset.view));document.getElementById('logout').onclick=()=>{localStorage.removeItem('tsl_admin_token');token=null;login()};document.getElementById('refreshTop').onclick=()=>load(true);document.getElementById('mobileMenu').onclick=()=>document.getElementById('sidebar').classList.toggle('open');document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeDrawer()};}
function switchView(view){document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(view).classList.add('active');document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));const titles={dashboard:['Today','Live reservation overview'],reservations:['Reservations','Manage guest bookings'],tables:['Tables & capacity','Control live floor availability']};document.getElementById('pageTitle').textContent=titles[view][0];document.getElementById('pageSub').textContent=titles[view][1];document.getElementById('sidebar').classList.remove('open');if(view==='reservations')renderReservations();if(view==='tables')renderTables();}
async function load(manual=false){if(state.loading)return;state.loading=true;try{const [rr,tt]=await Promise.all([api('/api/admin/reservations?'+new URLSearchParams({date:state.date,...(state.status?{status:state.status}:{})})),api('/api/admin/tables')]);state.rows=rr.reservations||[];state.tables=tt.tables||[];state.lastUpdated=new Date();renderAll();if(manual)showToast('Reservations refreshed');}catch(e){if(e.message!=='Unauthorized')showToast('Could not load reservations')}finally{state.loading=false}}
function renderAll(){renderDashboard();renderReservations();renderTables()}
function renderDashboard(){
 const rows=state.rows;
 const counts=rows.reduce((a,r)=>(a[r.status]=(a[r.status]||0)+1,a),{});
 const activeRows=rows.filter(r=>!['cancelled','no_show'].includes(r.status));
 const guests=activeRows.reduce((s,r)=>s+Number(r.guests||0),0);
 const confirmedGuests=rows.filter(r=>r.status==='confirmed').reduce((s,r)=>s+Number(r.guests||0),0);
 const capacity=state.tables.filter(t=>t.active).reduce((s,t)=>s+Number(t.capacity||0),0);
 const occupancy=capacity?Math.min(100,Math.round((confirmedGuests/capacity)*100)):0;
 const pending=counts.pending||0;
 const cancelled=(counts.cancelled||0)+(counts.no_show||0);
 const statusTotal=Math.max(1,rows.length);
 const confirmedPct=Math.round((counts.confirmed||0)/statusTotal*100);
 const pendingPct=Math.round((pending)/statusTotal*100);
 const cancelledPct=Math.round(cancelled/statusTotal*100);
 const completedPct=Math.max(0,100-confirmedPct-pendingPct-cancelledPct);
 const times=rows.filter(r=>r.start_time).reduce((a,r)=>{const h=(r.start_time||'').slice(0,2);a[h]=(a[h]||0)+1;return a},{});
 const maxHour=Math.max(1,...Object.values(times).map(Number));
 const hours=Object.keys(times).sort().slice(0,8);
 const attention=rows.filter(r=>['pending','waitlist'].includes(r.status)).slice(0,4);
 document.getElementById('dashboard').innerHTML=`
 <div class="hero-card"><div><div class="eyebrow">The Summer Lounge · operations</div><h2>${formatDate(state.date)}</h2><p>Good evening. Here's everything the floor team needs to run service smoothly.</p></div><div class="date-big"><label style="display:block;font-size:9px;text-transform:uppercase;letter-spacing:1px;margin-bottom:5px">Service date</label><input id="dashDate" type="date" value="${esc(state.date)}" style="background:#ffffff14;border:1px solid #ffffff30;color:#fff;border-radius:9px;padding:9px"></div></div>
 <div class="kpi-grid">
  <div class="kpi"><div class="kpi-label">Reservations</div><div class="kpi-value">${rows.length}</div><div class="kpi-note">All bookings for this service</div></div>
  <div class="kpi"><div class="kpi-label">Expected guests</div><div class="kpi-value">${guests}</div><div class="kpi-note">${confirmedGuests} guests confirmed</div></div>
  <div class="kpi"><div class="kpi-label">Pending attention</div><div class="kpi-value">${pending}</div><div class="kpi-note">${pending?'Needs staff action':'Everything is up to date'}</div></div>
  <div class="kpi"><div class="kpi-label">Table occupancy</div><div class="kpi-value">${occupancy}%</div><div class="kpi-note">${capacity} active seats available</div></div>
 </div>
 <div class="service-strip"><div class="service-chip"><b>${counts.confirmed||0}</b><span>Confirmed</span></div><div class="service-chip"><b>${counts.completed||0}</b><span>Completed</span></div><div class="service-chip"><b>${counts.no_show||0}</b><span>No-shows</span></div><div class="service-chip"><b>${counts.cancelled||0}</b><span>Cancelled</span></div></div>
 <div class="dashboard-grid">
  <section class="panel"><div class="panel-head"><div><h3>Service timeline</h3><p>Booking concentration by arrival time.</p></div><button class="btn light small" id="openReservations">View reservations →</button></div>${hours.length?`<div class="timeline">${hours.map(h=>{const n=times[h]||0;return `<div class="time-row"><div class="time-label">${esc(h)}:00</div><div class="time-track"><div class="time-fill" style="width:${Math.max(8,Math.round(n/maxHour*100))}%"></div><div class="time-text">${n} booking${n===1?'':'s'}</div></div></div>`}).join('')}</div>`:`<div class="empty"><strong>No timed reservations</strong>Bookings will appear here as guests reserve.</div>`}</section>
  <section class="panel"><div class="panel-head"><div><h3>Booking mix</h3><p>Today's reservation status.</p></div></div><div class="donut-wrap"><div class="donut" style="background:conic-gradient(#2f695c 0 ${confirmedPct}%,#b49463 ${confirmedPct}% ${confirmedPct+pendingPct}%,#a85850 ${confirmedPct+pendingPct}% ${confirmedPct+pendingPct+cancelledPct}%,#66547e ${confirmedPct+pendingPct+cancelledPct}% 100%)"></div></div><div class="legend"><div class="legend-row"><span class="legend-left"><i class="legend-dot" style="background:#2f695c"></i>Confirmed</span><b>${counts.confirmed||0}</b></div><div class="legend-row"><span class="legend-left"><i class="legend-dot" style="background:#b49463"></i>Pending</span><b>${pending}</b></div><div class="legend-row"><span class="legend-left"><i class="legend-dot" style="background:#a85850"></i>Cancelled / no-show</span><b>${cancelled}</b></div><div class="legend-row"><span class="legend-left"><i class="legend-dot" style="background:#66547e"></i>Completed</span><b>${counts.completed||0}</b></div></div></section>
  <section class="panel"><div class="panel-head"><div><h3>Today's reservations</h3><p>The next guests on the floor.</p></div><span class="badge confirmed">Live</span></div>${rows.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Guest</th><th>Party</th><th>Table</th><th>Status</th></tr></thead><tbody>${rows.slice(0,7).map(rowHtml).join('')}</tbody></table></div>`:`<div class="empty"><strong>No reservations yet</strong>There are no bookings for ${esc(formatDate(state.date))}.</div>`}</section>
  <section class="panel"><div class="panel-head"><div><h3>Needs attention</h3><p>Keep the service team ahead of the floor.</p></div></div><div class="attention">${attention.length?attention.map(r=>`<div class="attention-item"><div><strong>${esc(r.name)}</strong><small>${esc((r.start_time||'').slice(0,5))} · ${esc(r.guests)} guests · ${esc(r.confirmation_code||'')}</small></div><button class="btn light small" data-detail="${esc(r.id)}">Open</button></div>`).join(''):`<div class="empty" style="padding:25px 10px"><strong>All clear</strong>No pending bookings need attention.</div>`}</div></section>
 </div>
 <section class="panel" style="margin-top:20px"><div class="panel-head"><div><h3>Floor capacity</h3><p>Live table capacity based on active tables.</p></div><button class="btn light small" id="quickTables">Manage tables →</button></div><div style="height:10px;background:#edf0eb;border-radius:20px;overflow:hidden"><div style="width:${occupancy}%;height:100%;background:linear-gradient(90deg,#244d45,#b49463);border-radius:20px"></div></div><div style="display:flex;justify-content:space-between;margin-top:8px;font-size:10px;color:var(--muted)"><span>${confirmedGuests} confirmed seats</span><span>${capacity} active seats</span></div></section>`;
 document.getElementById('dashDate').onchange=e=>{state.date=e.target.value;state.search='';load()};
 document.getElementById('openReservations').onclick=()=>switchView('reservations');
 document.getElementById('quickTables').onclick=()=>switchView('tables');
 bindRowActions();
}
function renderReservations(){const filtered=state.rows.filter(r=>{const q=state.search.toLowerCase();return !q||[r.name,r.email,r.phone,r.confirmation_code,r.table_name].some(v=>String(v||'').toLowerCase().includes(q))});document.getElementById('reservations').innerHTML=`<section class="panel"><div class="panel-head"><div><h3>Reservation book</h3><p>${filtered.length} result${filtered.length===1?'':'s'} for ${esc(formatDate(state.date))}${state.lastUpdated?' · Updated '+state.lastUpdated.toLocaleTimeString('en-KE',{hour:'2-digit',minute:'2-digit'}):''}</p></div><button class="btn primary" id="newRefresh">Refresh</button></div><div class="toolbar" style="margin-bottom:18px"><div class="field"><label>Date</label><input id="filterDate" type="date" value="${esc(state.date)}"></div><div class="field"><label>Status</label><select id="filterStatus"><option value="">All statuses</option>${['confirmed','pending','waitlist','cancelled','completed','no_show'].map(s=>`<option value="${s}" ${state.status===s?'selected':''}>${s.replace('_',' ')}</option>`).join('')}</select></div><div class="field grow search"><label>Search</label><span>⌕</span><input id="search" placeholder="Guest, phone, email or confirmation code" value="${esc(state.search)}"></div><button class="btn light" id="clearFilters">Clear</button></div>${filtered.length?`<div class="tablewrap"><table class="table"><thead><tr><th>Time</th><th>Guest</th><th>Party</th><th>Phone</th><th>Table</th><th>Status</th><th>Confirmation</th><th>Actions</th></tr></thead><tbody>${filtered.map(r=>`<tr><td><b>${esc((r.start_time||'').slice(0,5))}</b><br><small>${esc(r.reservation_date||'')}</small></td><td><div class="guest"><span class="avatar">${esc(initials(r.name))}</span><span><strong>${esc(r.name)}</strong><small>${esc(r.email||'')}</small></span></div></td><td>${esc(r.guests)}</td><td>${esc(r.phone)}</td><td>${esc(r.table_name||'Unassigned')}</td><td><span class="badge ${esc(r.status)}">${esc(r.status.replace('_',' '))}</span></td><td><b>${esc(r.confirmation_code)}</b></td><td><div class="actions"><button class="btn light small" data-detail="${esc(r.id)}">View</button>${['confirmed','cancelled','completed','no_show'].map(s=>`<button class="btn small ${s==='cancelled'?'danger':'primary'}" data-id="${esc(r.id)}" data-status="${s}">${s==='no_show'?'No show':s[0].toUpperCase()+s.slice(1)}</button>`).join('')}</div></td></tr>`).join('')}</tbody></table></div>`:`<div class="empty"><strong>No matching reservations</strong>Try another date, status or search term.</div>`}</section>`;document.getElementById('filterDate').onchange=e=>{state.date=e.target.value;state.search='';load()};document.getElementById('filterStatus').onchange=e=>{state.status=e.target.value;load()};document.getElementById('search').oninput=e=>{state.search=e.target.value;renderReservations()};document.getElementById('clearFilters').onclick=()=>{state.date=localDate();state.status='';state.search='';load()};document.getElementById('newRefresh').onclick=()=>load(true);bindRowActions()}
function bindRowActions(){document.querySelectorAll('[data-detail]').forEach(b=>b.onclick=()=>openDetail(b.dataset.detail));document.querySelectorAll('[data-status]').forEach(b=>b.onclick=()=>updateReservation(b.dataset.id,b.dataset.status))}
function openDetail(id){const r=state.rows.find(x=>String(x.id)===String(id));if(!r)return;document.getElementById('drawerCard').innerHTML=`<div class="drawer-head"><div><div class="eyebrow">Reservation ${esc(r.confirmation_code||'')}</div><h2>${esc(r.name)}</h2><span class="badge ${esc(r.status)}">${esc(r.status.replace('_',' '))}</span></div><button class="icon-btn" onclick="closeDrawer()">✕</button></div><div class="detail-list"><div class="detail-row"><label>Date & time</label><span>${esc(formatDate(r.reservation_date))} · ${esc((r.start_time||'').slice(0,5))}</span></div><div class="detail-row"><label>Party</label><span>${esc(r.guests)} guest${Number(r.guests)===1?'':'s'}</span></div><div class="detail-row"><label>Phone</label><span>${esc(r.phone||'—')}</span></div><div class="detail-row"><label>Email</label><span>${esc(r.email||'—')}</span></div><div class="detail-row"><label>Table</label><span>${esc(r.table_name||'Unassigned')}</span></div><div class="detail-row"><label>Special requests</label><span>${esc(r.notes||r.special_requests||'None')}</span></div><div class="detail-row"><label>Booked</label><span>${r.created_at?esc(new Date(r.created_at).toLocaleString('en-KE')):'—'}</span></div></div><div class="toolbar">${['confirmed','cancelled','completed','no_show'].map(s=>`<button class="btn ${s==='cancelled'?'danger':'primary'}" data-id="${esc(r.id)}" data-status="${s}">${s==='no_show'?'Mark no-show':'Mark '+s}</button>`).join('')}</div>`;document.querySelectorAll('#drawerCard [data-status]').forEach(b=>b.onclick=async()=>{await updateReservation(b.dataset.id,b.dataset.status);closeDrawer()});document.getElementById('drawer').classList.add('open')}
function closeDrawer(){document.getElementById('drawer').classList.remove('open')}
async function updateReservation(id,status){try{await api('/api/admin/reservation',{method:'PATCH',body:JSON.stringify({id,status})});showToast('Reservation updated');await load()}catch(e){if(e.message!=='Unauthorized')showToast(e.message)}}
function renderTables(){document.getElementById('tables').innerHTML=`<section class="panel"><div class="panel-head"><div><h3>Floor capacity</h3><p>Changes here affect live availability for guests immediately.</p></div><button class="btn light" id="tablesRefresh">Refresh</button></div><div class="capacity-grid">${state.tables.map(t=>`<div class="capacity-card"><div class="capacity-head"><strong>${esc(t.name)}</strong><span class="badge ${t.active?'confirmed':'cancelled'}">${t.active?'Active':'Inactive'}</span></div><div class="capacity-meta">Table ID · ${esc(t.id)}</div><div class="capacity-controls" style="margin-top:15px"><div class="field"><label>Seats</label><input class="tablecap" data-id="${esc(t.id)}" type="number" min="1" max="30" value="${esc(t.capacity)}"></div><label class="switch"><input class="tableactive" data-id="${esc(t.id)}" type="checkbox" ${t.active?'checked':''}> Active</label><button class="btn primary small savecap" data-id="${esc(t.id)}">Save</button></div></div>`).join('')}</div></section><section class="panel"><div class="panel-head"><div><h3>How availability works</h3><p>Staff controls are connected to the live reservation database.</p></div></div><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:14px"><div><b>1 · Capacity</b><p style="color:var(--muted);font-size:12px;line-height:1.6">Set each table's real seat count and keep inactive tables switched off.</p></div><div><b>2 · Reservations</b><p style="color:var(--muted);font-size:12px;line-height:1.6">Confirmed bookings consume table capacity for the selected time window.</p></div><div><b>3 · Guests</b><p style="color:var(--muted);font-size:12px;line-height:1.6">The public booking form sees the same live availability instantly.</p></div></div></section>`;document.getElementById('tablesRefresh').onclick=()=>load(true);document.querySelectorAll('.savecap').forEach(b=>b.onclick=async()=>{const cap=document.querySelector(`.tablecap[data-id="${b.dataset.id}"]`);const active=document.querySelector(`.tableactive[data-id="${b.dataset.id}"]`).checked;try{await api('/api/admin/tables',{method:'PATCH',body:JSON.stringify({id:b.dataset.id,capacity:Number(cap.value),active})});b.textContent='Saved ✓';showToast('Table capacity updated');setTimeout(()=>b.textContent='Save',1200);await load()}catch(e){showToast(e.message)}})}
window.closeDrawer=closeDrawer;
if(token){renderShell();load()}else login();
</script>
</body>
</html>
