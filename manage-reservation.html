<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Manage Reservation | The Summer Lounge</title><style>
:root{--green:#173f37;--cream:#f5f0e6;--gold:#c4a46b;--ink:#183d36;--muted:#6d7974}*{box-sizing:border-box}body{margin:0;background:var(--cream);color:var(--ink);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:720px;margin:50px auto;padding:20px}.card{background:#fff;border:1px solid #e5ded2;border-radius:24px;overflow:hidden;box-shadow:0 18px 60px #173f3714}.head{background:var(--green);padding:30px;text-align:center}.head img{max-width:210px;max-height:78px;object-fit:contain;background:#fff;border-radius:10px;padding:8px}.body{padding:34px}.eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:11px;color:#9a7a45;font-weight:800}.h{font-family:Georgia,serif;font-size:36px;margin:8px 0 10px}.muted{color:var(--muted);line-height:1.6}.details{background:#f8f4ec;border-radius:16px;padding:18px;margin:24px 0}.row{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-bottom:1px solid #e7dfd2}.row:last-child{border:0}.row span:first-child{color:var(--muted)}button{border:0;border-radius:11px;padding:13px 18px;font-weight:800;cursor:pointer}.primary{background:var(--green);color:#fff}.gold{background:var(--gold);color:var(--green)}.danger{background:#f3ddd8;color:#8d4339}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.field{margin-top:14px}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:7px}.field input{width:100%;padding:13px;border:1px solid #ddd5c7;border-radius:10px;background:#fff;font:inherit}.hidden{display:none}.notice{padding:14px;border-radius:12px;background:#eef3ef;margin-top:18px}.error{background:#f7e2de;color:#8d4339;padding:12px;border-radius:10px;margin-top:15px}.success{background:#e0eee6;color:#2d5c4d;padding:12px;border-radius:10px;margin-top:15px}@media(max-width:600px){.wrap{margin:15px auto}.body{padding:24px}.h{font-size:30px}.row{flex-direction:column;gap:3px}}
</style></head><body><div class="wrap"><div class="card"><div class="head"><img src="assets/summer-lounge-logo.jpg" alt="The Summer Lounge"></div><div class="body"><div class="eyebrow">Guest reservation</div><h1 class="h">Manage your table</h1><p class="muted">Use this private link to review, cancel or reschedule your reservation.</p><div id="app">Loading reservation…</div></div></div></div><script>
const qs=new URLSearchParams(location.search),token=qs.get('token'),app=document.getElementById('app');let current=null;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function fmtDate(v){return new Date(v+'T00:00:00').toLocaleDateString('en-KE',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}
function render(){const r=current;app.innerHTML=`<div class="details"><div class="row"><span>Guest</span><strong>${esc(r.name)}</strong></div><div class="row"><span>Date</span><strong>${esc(fmtDate(r.reservation_date))}</strong></div><div class="row"><span>Time</span><strong>${esc(r.start_time.slice(0,5))}</strong></div><div class="row"><span>Guests</span><strong>${esc(r.guests)}</strong></div><div class="row"><span>Table</span><strong>${esc(r.table_name||'Assigned on arrival')}</strong></div><div class="row"><span>Confirmation</span><strong>${esc(r.confirmation_code)}</strong></div><div class="row"><span>Status</span><strong>${esc(r.status.replace('_',' '))}</strong></div></div><div class="actions"><button class="primary" onclick="showReschedule()">Reschedule</button><button class="danger" onclick="cancelReservation()">Cancel reservation</button></div><div id="manageMessage"></div><div id="reschedule" class="hidden"><div class="field"><label>New date</label><input id="newDate" type="date"></div><div class="field"><label>New time</label><input id="newTime" type="time" step="1800"></div><div class="actions"><button class="gold" onclick="reschedule()">Confirm new time</button><button onclick="document.getElementById('reschedule').classList.add('hidden')">Back</button></div></div>`;}
async function load(){if(!token){app.innerHTML='<div class="error">This reservation link is missing or invalid.</div>';return}try{const r=await fetch('/api/manage-reservation?token='+encodeURIComponent(token));const d=await r.json();if(!r.ok)throw Error(d.error);current=d.reservation;render();}catch(e){app.innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
function showReschedule(){document.getElementById('reschedule').classList.remove('hidden');document.getElementById('newDate').min=new Date().toISOString().slice(0,10);}
async function post(payload){const r=await fetch('/api/manage-reservation?token='+encodeURIComponent(token),{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(payload)});const d=await r.json();if(!r.ok)throw Error(d.error);return d}
async function cancelReservation(){if(!confirm('Cancel this reservation?'))return;try{const d=await post({action:'cancel'});document.getElementById('manageMessage').innerHTML='<div class="success">'+esc(d.message)+'</div>';await load();}catch(e){document.getElementById('manageMessage').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
async function reschedule(){try{const d=await post({action:'reschedule',date:document.getElementById('newDate').value,time:document.getElementById('newTime').value});document.getElementById('manageMessage').innerHTML='<div class="success">'+esc(d.message)+'</div>';await load();}catch(e){document.getElementById('manageMessage').innerHTML='<div class="error">'+esc(e.message)+'</div>'}}
load();
</script></body></html>
